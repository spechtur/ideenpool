<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideenpool & Inspirationshäppchen</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f4fb;
  --surface:rgba(255,255,255,0.6);
  --surface2:rgba(255,255,255,0.4);
  --ink:#211f2e;
  --ink2:#5b5872;
  --ink3:#8e8ba6;
  --line:rgba(40,30,70,0.10);
  --line2:rgba(40,30,70,0.18);
  --shadow:0 4px 18px rgba(60,40,110,0.07),0 1px 2px rgba(60,40,110,0.05);
  --shadow-lift:0 20px 48px rgba(60,40,110,0.14),0 4px 10px rgba(60,40,110,0.07);
  --f-display:'Fraunces',Georgia,serif;
  --f-mono:'DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,sans-serif;
  --radius:20px;
  --violet:#7c6ff0;
  --violet-ink:#4c3fb8;
  --teal:#2bb3a3;
  --coral:#f0967a;
  --glass-blur:blur(22px) saturate(170%);
}

*{box-sizing:border-box;}

body{
  font-family:var(--f-body);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}

/* soft glass backdrop - eigene Farbwelt (Indigo/Teal/Koralle statt Amber/Pink/Blau) */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 10% 8%, rgba(124,111,240,0.28), transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(43,179,163,0.26), transparent 45%),
    radial-gradient(circle at 85% 78%, rgba(240,150,122,0.24), transparent 45%),
    radial-gradient(circle at 12% 82%, rgba(196,132,252,0.22), transparent 45%),
    radial-gradient(circle at 50% 45%, rgba(124,111,240,0.08), transparent 60%),
    linear-gradient(180deg, #f7f6fc 0%, #eef0f6 100%);
  background-attachment:fixed;
  pointer-events:none;
  z-index:0;
}

/* ══ DISCOVER ══ */
#mode-discover{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px 60px;
  gap:0;
}

.d-eyebrow{
  font-family:var(--f-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--violet-ink);
  margin-bottom:16px;
  text-align:center;
  padding:7px 16px;
  border-radius:999px;
  background:rgba(124,111,240,0.12);
  border:1px solid rgba(124,111,240,0.2);
}

.d-title{
  font-family:var(--f-display);
  font-size:clamp(28px,5vw,52px);
  font-weight:600;
  font-style:italic;
  text-align:center;
  line-height:1.12;
  margin-bottom:10px;
  letter-spacing:-0.01em;
  background:linear-gradient(90deg,#4c3fb8,#7c6ff0 45%,#2bb3a3 85%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.d-title span{
  display:inline;
  position:relative;
}

.d-title .accent{
  color:transparent;
  -webkit-text-stroke:2px var(--violet);
  font-style:normal;
}

.d-sub{
  font-size:14px;
  color:var(--ink3);
  text-align:center;
  margin-bottom:52px;
  font-family:var(--f-body);
  font-style:italic;
  letter-spacing:0.01em;
}

/* ── SHELF ── */
#shelf{
  display:flex;
  gap:18px;
  justify-content:center;
  align-items:flex-start;
  margin-bottom:40px;
  width:100%;
  max-width:960px;
  flex-wrap:wrap;
}

.karte{
  background:var(--surface);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-radius:var(--radius);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
  width:280px;
  flex-shrink:0;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.7);
  transition:transform 0.28s cubic-bezier(.22,1,.36,1), box-shadow 0.22s ease;
  position:relative;
}

.karte:nth-child(1){transform:rotate(-1.5deg) translateY(4px)}
.karte:nth-child(2){transform:rotate(0.8deg) translateY(-4px)}
.karte:nth-child(3){transform:rotate(-0.4deg) translateY(2px)}

.karte:hover{
  transform:rotate(0deg) translateY(-8px) scale(1.01) !important;
  box-shadow:var(--shadow-lift), inset 0 1px 0 rgba(255,255,255,0.7);
  z-index:20;
  border-color:rgba(255,255,255,0.9);
}

.karte-body{
  padding:20px 22px 18px;
}

.karte-prinzip{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
}

.karte-prinzip::before{
  content:'';
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  flex-shrink:0;
}

.karte-idee{
  font-family:var(--f-display);
  font-size:17px;
  font-weight:500;
  line-height:1.42;
  color:var(--ink);
  margin-bottom:16px;
  letter-spacing:-0.01em;
}

.karte-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.ktag{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--line2);
  color:var(--ink2);
  background:rgba(255,255,255,0.55);
  cursor:pointer;
  transition:all 0.13s;
  letter-spacing:0.02em;
}

.ktag.stufen-tag{
  border-style:dashed;
}

.ktag:hover{
  background:var(--violet);
  color:#fff;
  border-color:var(--violet);
}

/* ── ACTIONS ── */
.d-actions{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.d-count{
  font-family:var(--f-mono);
  font-size:11px;
  color:var(--ink3);
  letter-spacing:0.04em;
  min-height:14px;
}

.btn-shuffle{
  font-family:var(--f-body);
  font-size:14px;
  font-weight:700;
  padding:14px 38px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.5);
  background:linear-gradient(90deg,var(--violet-ink),var(--violet) 60%,var(--teal));
  color:#fff;
  cursor:pointer;
  letter-spacing:0.01em;
  transition:all 0.18s;
  box-shadow:0 10px 30px rgba(76,63,184,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
}

.btn-shuffle:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 36px rgba(76,63,184,0.34), inset 0 1px 0 rgba(255,255,255,0.4);
}

.btn-shuffle:active{
  transform:translateY(0);
  box-shadow:0 6px 18px rgba(76,63,184,0.24), inset 0 1px 0 rgba(255,255,255,0.3);
}

.btn-to-explore{
  font-family:var(--f-mono);
  font-size:11px;
  color:var(--ink3);
  background:none;
  border:none;
  cursor:pointer;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:4px 8px;
  transition:color 0.14s;
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-color:var(--line2);
  opacity:0.5;
  transition:opacity 0.3s,color 0.15s;
}

.btn-to-explore.visible{opacity:1}
.btn-to-explore:hover{color:var(--ink)}

/* ══ EXPLORE ══ */
#mode-explore{
  display:none;
  position:relative;
  z-index:1;
  min-height:100vh;
}

#mode-explore.on{display:block}

.ex-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(247,246,252,0.78);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid rgba(255,255,255,0.6);
  box-shadow:0 4px 24px rgba(60,40,110,0.05);
  padding:20px 40px 16px;
}

.ex-header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  gap:12px;
}

.ex-title{
  font-family:var(--f-display);
  font-size:20px;
  font-weight:600;
  font-style:italic;
  letter-spacing:-0.01em;
  color:var(--violet-ink);
}

.btn-back{
  font-family:var(--f-body);
  font-size:12px;
  font-weight:600;
  letter-spacing:0.02em;
  color:var(--ink2);
  background:rgba(255,255,255,0.5);
  border:1px solid var(--line2);
  border-radius:999px;
  padding:7px 16px;
  cursor:pointer;
  transition:all 0.14s;
}

.btn-back:hover{color:var(--ink);border-color:var(--violet);background:rgba(124,111,240,0.1)}

/* ── FILTER GROUPS ── */
.filter-groups{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.filter-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.filter-row-label{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink3);
  min-width:44px;
  flex-shrink:0;
}

.fbtn{
  font-family:var(--f-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:0.02em;
  padding:5px 13px;
  border-radius:999px;
  border:1px solid var(--line2);
  background:rgba(255,255,255,0.5);
  color:var(--ink2);
  cursor:pointer;
  transition:all 0.12s;
}

.fbtn:hover{background:rgba(255,255,255,0.85);color:var(--ink);border-color:var(--line2)}

.fbtn.on{
  background:var(--violet);
  color:#fff;
  border-color:var(--violet);
}

.fbtn.prinzip-btn.on{
  color:#fff;
  border-color:transparent;
}

/* ── RESULT COUNT ── */
.result-count{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:0.03em;
  color:var(--ink3);
}

/* ── EXPLORE CONTENT ── */
.ex-content{
  padding:20px 40px 80px;
  max-width:1280px;
  margin:0 auto;
}

.prinzip-block{
  margin-bottom:40px;
}

.prinzip-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 18px;
  border-radius:var(--radius);
  margin-bottom:14px;
  cursor:pointer;
  transition:opacity 0.15s, box-shadow 0.15s;
  border:1px solid transparent;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  user-select:none;
}

.prinzip-head:hover{opacity:0.85}
.prinzip-head.active-filter{opacity:1;box-shadow:var(--shadow)}

.p-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  flex-shrink:0;
}

.p-nr{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:700;
  color:inherit;
  opacity:0.7;
  letter-spacing:0.04em;
}

.p-name{
  font-family:var(--f-display);
  font-size:18px;
  font-weight:600;
  font-style:italic;
  letter-spacing:-0.01em;
}

.p-sub{
  font-family:var(--f-body);
  font-size:12px;
  opacity:0.7;
}

.p-count{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:600;
  opacity:0.6;
  margin-left:auto;
}

/* ── CARDS GRID ── */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}

.e-card{
  background:var(--surface);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.7);
  transition:box-shadow 0.18s,transform 0.18s,border-color 0.15s;
}

.e-card:hover{
  box-shadow:var(--shadow-lift);
  transform:translateY(-3px);
  border-color:rgba(255,255,255,0.9);
}

.e-card.hidden{display:none}

.e-body{
  padding:14px 16px 12px;
}

.e-text{
  font-family:var(--f-display);
  font-size:14px;
  font-weight:500;
  line-height:1.48;
  color:var(--ink);
  margin-bottom:11px;
  letter-spacing:-0.005em;
}

.e-tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.e-tag{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:600;
  padding:3px 9px;
  border-radius:999px;
  border:1px solid var(--line2);
  color:var(--ink2);
  background:rgba(255,255,255,0.5);
  cursor:pointer;
  transition:all 0.11s;
  letter-spacing:0.02em;
}

.e-tag.s-tag{border-style:dashed}
.e-tag:hover{background:var(--violet);color:#fff;border-color:var(--violet)}

.no-results{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--ink3);
  font-family:var(--f-body);
  font-style:italic;
  font-size:14px;
  letter-spacing:0.01em;
}


/* ── PRINZIP INFO PANEL ── */
.prinzip-info{
  background:var(--surface);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:var(--radius);
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
  animation:fadeUp 0.3s ease both;
}

.pi-warum{
  font-family:var(--f-body);
  font-size:13.5px;
  line-height:1.7;
  color:var(--ink2);
  margin-bottom:16px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}

.pi-compare{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:14px;
  align-items:start;
}

.pi-arrow{
  font-family:var(--f-mono);
  font-size:18px;
  padding-top:18px;
  opacity:0.7;
}

.pi-label{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink3);
  margin-bottom:6px;
}

.pi-text{
  font-size:12.5px;
  line-height:1.62;
  color:var(--ink);
}

@media(max-width:600px){
  .pi-compare{grid-template-columns:1fr;gap:10px}
  .pi-arrow{display:none}
}


/* ── COLLAPSE ALL TOGGLE ── */
.ex-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:4px;
}

.btn-collapse-all{
  font-family:var(--f-body);
  font-size:11px;
  font-weight:600;
  letter-spacing:0.02em;
  color:var(--ink3);
  background:rgba(255,255,255,0.45);
  border:1px solid var(--line2);
  border-radius:999px;
  padding:6px 14px;
  cursor:pointer;
  transition:all 0.13s;
  white-space:nowrap;
}
.btn-collapse-all:hover{color:var(--ink);border-color:var(--violet);background:rgba(124,111,240,0.1)}

/* collapsed prinzip block */
.prinzip-block.collapsed .cards-grid,
.prinzip-block.collapsed .prinzip-info{display:none}

/* ── FILTER COLLAPSE (mobile) ── */
.filter-toggle{
  display:none;
  font-family:var(--f-body);
  font-size:12px;
  font-weight:600;
  letter-spacing:0.02em;
  color:var(--ink2);
  background:rgba(255,255,255,0.4);
  border:1px solid var(--line2);
  border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
  width:100%;
  text-align:left;
  transition:all 0.13s;
}
.filter-toggle:hover{background:rgba(255,255,255,0.7)}

.filter-groups{
  transition:max-height 0.25s ease, opacity 0.2s ease;
  overflow:hidden;
  max-height:400px;
}

.filter-groups.collapsed{
  max-height:0 !important;
  opacity:0;
  pointer-events:none;
}

@media(max-width:700px){
  .filter-toggle{display:block}
}

/* ── FOOTER ── */
.site-footer{
  text-align:center;
  padding:32px 20px 24px;
  font-family:var(--f-body);
  font-size:11px;
  font-style:italic;
  letter-spacing:0.02em;
  color:var(--ink3);
  border-top:1px solid var(--line);
  margin-top:20px;
}

/* ── ANIMATIONS ── */
@keyframes cardIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.karte{animation:cardIn 0.4s cubic-bezier(.22,1,.36,1) both}
.karte:nth-child(1){animation-delay:0.04s;transform:rotate(-1.5deg) translateY(4px)}
.karte:nth-child(2){animation-delay:0.11s;transform:rotate(0.8deg) translateY(-4px)}
.karte:nth-child(3){animation-delay:0.18s;transform:rotate(-0.4deg) translateY(2px)}

@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.e-card{animation:fadeUp 0.22s ease both}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  #shelf{gap:14px;flex-direction:column;align-items:center}
  .karte{width:calc(100vw - 40px);max-width:360px}
  .karte:nth-child(n){transform:none !important}
  .ex-header{padding:16px 20px 14px}
  .ex-content,.result-count{padding-left:20px;padding-right:20px}
  .cards-grid{grid-template-columns:1fr}
  .filter-row{gap:5px}
}
</style>
</head>
<body>

<div id="mode-discover">
  <p class="d-eyebrow">Lernen in einer Kultur der Digitalität</p>
  <h1 class="d-title">
    <span>Ideenpool</span> <span class="accent">&amp;</span><br>
    <span>Inspirationshäppchen</span>
  </h1>
  <p class="d-sub">// drei zufällige ideen — lass dich überraschen</p>
  <div id="shelf"></div>
  <div class="d-actions">
    <div class="d-count" id="d-count"></div>
    <button class="btn-shuffle" onclick="shuffle()">↺ &nbsp;Andere zeigen</button>
    <button class="btn-to-explore" id="btn-explore" onclick="goExplore(null)">Alle Ideen systematisch durchsuchen →</button>
  </div>
</div>

<div id="mode-explore">
  <div class="ex-header">
    <div class="ex-header-row">
      <span class="ex-title">Alle Inspirationshäppchen</span>
      <button class="btn-back" onclick="goDiscover()">← Entdecken</button>
    </div>
    <button class="filter-toggle" id="filter-toggle" onclick="toggleFilters()">⚙ Filter anzeigen</button>
    <div class="filter-groups" id="filter-groups">
      <div class="filter-row">
        <span class="filter-row-label">Stufe</span>
        <div id="filter-stufe" style="display:flex;gap:5px;flex-wrap:wrap"></div>
      </div>
      <div class="filter-row">
        <span class="filter-row-label">Fach</span>
        <div id="filter-fach" style="display:flex;gap:5px;flex-wrap:wrap"></div>
      </div>
      <div class="filter-row">
        <span class="filter-row-label">Prinzip</span>
        <div id="filter-prinzip" style="display:flex;gap:5px;flex-wrap:wrap"></div>
      </div>
    </div>
  </div>
  <div class="ex-toolbar" style="padding:16px 40px 0;max-width:1280px;margin:0 auto;">
    <div class="result-count" id="result-count"></div>
    <button class="btn-collapse-all" id="btn-collapse" onclick="toggleCollapseAll()">Alle zuklappen</button>
  </div>
  <div class="ex-content" id="ex-content"></div>
  <footer class="site-footer">Prototyp V1.0 &nbsp;|&nbsp; David Halser, Juni 2026</footer>
</div>

<script>
const STUFEN = ['KG','US','MS','OS'];
const FAECHER = ['NMG','Mathe','WAH','TTG','BG','Musik','Sport','D/F/E','ERG','RZG','M&I','BO','BNE','SoftSkills','Strategien','fachübergr.'];

  {id:1,color:'#F2650F',bg:'rgba(242,101,15,0.10)',name:'Echtes Publikum',sub:'Lernprodukte verlassen die Klasse',

let shuffleN = 0;
let usedSet = new Set();
let filterStufe = new Set();
let filterFach = new Set();
let filterPrinzip = null;

// ── DISCOVER ──
function allIdeen(){
  return P.flatMap(p=>p.ideen.map(i=>({...i,pid:p.id,pname:p.name,color:p.color,bg:p.bg})));
}

function shuffle(){
  shuffleN++;
  document.getElementById('d-count').textContent = shuffleN > 1 ? shuffleN+'. Runde' : '';
  const exploreBtn = document.getElementById('btn-explore');
  if(shuffleN >= 3) exploreBtn.classList.add('visible');

  let pool = allIdeen();
  if(usedSet.size > pool.length * 0.6) usedSet.clear();
  pool = pool.filter(i=>!usedSet.has(i.t));
  pool.sort(()=>Math.random()-0.5);
  const picks = pool.slice(0,3);
  picks.forEach(i=>usedSet.add(i.t));

  const shelf = document.getElementById('shelf');
  shelf.style.opacity='0';
  shelf.style.transform='translateY(8px)';
  shelf.style.transition='opacity 0.16s,transform 0.16s';
  setTimeout(()=>{
    renderShelf(picks);
    shelf.style.opacity='1';
    shelf.style.transform='translateY(0)';
  },160);
}

function renderShelf(picks){
  const shelf = document.getElementById('shelf');
  shelf.innerHTML='';
  picks.forEach(item=>{
    const card = document.createElement('div');
    card.className='karte';
    const sTags = item.s.map(t=>`<span class="ktag stufen-tag" onclick="filterAndExplore('s','${t}')">${t}</span>`).join('');
    const fTags = item.f.map(t=>`<span class="ktag" onclick="filterAndExplore('f','${t}')">${t}</span>`).join('');
    card.innerHTML=`
      <div class="karte-body">
        <div class="karte-prinzip" style="color:${item.color}">
          <span style="background:${item.color}" class="karte-prinzip" ></span>
          ${item.pname}
        </div>
        <div class="karte-idee" style="color:${item.color}">${item.t}</div>
        <div class="karte-tags">${sTags}${fTags}</div>
      </div>`;
    card.onclick=()=>filterAndExplore('p',item.pid);
    // prevent tag clicks from triggering card click
    card.querySelectorAll('.ktag').forEach(el=>el.addEventListener('click',e=>e.stopPropagation()));
    shelf.appendChild(card);
  });
}

function filterAndExplore(type, val){
  filterStufe.clear(); filterFach.clear(); filterPrinzip=null;
  if(type==='s') filterStufe.add(val);
  else if(type==='f') filterFach.add(val);
  else if(type==='p') filterPrinzip=val;
  goExplore();
}

// ── EXPLORE ──
function goExplore(){
  // reset filter height for desktop
  const fg = document.getElementById('filter-groups');
  if(fg && window.innerWidth > 700){ fg.style.maxHeight='none'; fg.classList.remove('collapsed'); }
  document.getElementById('mode-discover').style.display='none';
  const ex = document.getElementById('mode-explore');
  ex.classList.add('on');
  buildFilterBtns();
  renderExplore();
  window.scrollTo(0,0);
}

function goDiscover(){
  document.getElementById('mode-explore').classList.remove('on');
  document.getElementById('mode-discover').style.display='flex';
  window.scrollTo(0,0);
}

function buildFilterBtns(){
  // Stufe
  const fs = document.getElementById('filter-stufe');
  fs.innerHTML='';
  const b0 = mkFBtn('Alle', filterStufe.size===0, ()=>{filterStufe.clear();renderExplore();rebuildActive()});
  fs.appendChild(b0);
  STUFEN.forEach(t=>{
    const b = mkFBtn(t, filterStufe.has(t), ()=>{
      filterStufe.has(t)?filterStufe.delete(t):filterStufe.add(t);
      renderExplore(); rebuildActive();
    });
    fs.appendChild(b);
  });

  // Fach
  const ff = document.getElementById('filter-fach');
  ff.innerHTML='';
  const b1 = mkFBtn('Alle', filterFach.size===0, ()=>{filterFach.clear();renderExplore();rebuildActive()});
  ff.appendChild(b1);
  FAECHER.forEach(t=>{
    const b = mkFBtn(t, filterFach.has(t), ()=>{
      filterFach.has(t)?filterFach.delete(t):filterFach.add(t);
      renderExplore(); rebuildActive();
    });
    ff.appendChild(b);
  });

  // Prinzip
  const fp = document.getElementById('filter-prinzip');
  fp.innerHTML='';
  const b2 = mkFBtn('Alle', filterPrinzip===null, ()=>{filterPrinzip=null;renderExplore();rebuildActive()});
  fp.appendChild(b2);
  P.forEach(p=>{
    const b = mkFBtn(p.name, filterPrinzip===p.id, ()=>{
      filterPrinzip = filterPrinzip===p.id ? null : p.id;
      renderExplore(); rebuildActive();
    }, p.color);
    fp.appendChild(b);
  });
}

function mkFBtn(label, active, onClick, color){
  const b = document.createElement('button');
  b.className='fbtn'+(active?' on':'');
  if(color && active) b.style.background=color;
  if(color && active) b.style.borderColor=color;
  b.textContent=label;
  b.addEventListener('click', onClick);
  return b;
}

function rebuildActive(){
  buildFilterBtns();
}

function cardMatches(item, p){
  const okStufe = filterStufe.size===0 || item.s.some(s=>filterStufe.has(s));
  const okFach = filterFach.size===0 || item.f.some(f=>filterFach.has(f));
  const okPrinzip = filterPrinzip===null || p.id===filterPrinzip;
  return okStufe && okFach && okPrinzip;
}

function renderExplore(){
  const content = document.getElementById('ex-content');
  const countEl = document.getElementById('result-count');
  content.innerHTML='';
  let total=0;

  P.forEach((p,pi)=>{
    const filtered = p.ideen.filter(i=>cardMatches(i,p));
    if(filtered.length===0) return;
    total+=filtered.length;

    const block = document.createElement('div');
    block.className='prinzip-block';

    const head = document.createElement('div');
    head.className='prinzip-head'+(filterPrinzip===p.id?' active-filter':'');
    head.style.background=p.bg;
    head.style.color=p.color;
    head.innerHTML=`
      <div class="p-dot" style="background:${p.color}"></div>
      <span class="p-nr">0${p.id}</span>
      <span class="p-name">${p.name}</span>
      <span class="p-sub">— ${p.sub}</span>
      <span class="p-count">${filtered.length} Ideen</span>`;
    head.onclick=()=>{
      filterPrinzip = filterPrinzip===p.id ? null : p.id;
      rebuildActive();
      renderExplore();
    };
    block.appendChild(head);

    if(filterPrinzip===p.id && p.info){
      const info = document.createElement('div');
      info.className='prinzip-info';
      info.style.background=p.bg;
      info.innerHTML=`
        <div class="pi-warum">${p.info.warum}</div>
        <div class="pi-compare">
          <div class="pi-col">
            <div class="pi-label">Bisher</div>
            <div class="pi-text">${p.info.vorher}</div>
          </div>
          <div class="pi-arrow" style="color:${p.color}">→</div>
          <div class="pi-col">
            <div class="pi-label" style="color:${p.color}">Jetzt</div>
            <div class="pi-text">${p.info.nachher}</div>
          </div>
        </div>`;
      block.appendChild(info);
    }

    const grid = document.createElement('div');
    grid.className='cards-grid';

    filtered.forEach((item,i)=>{
      const card = document.createElement('div');
      card.className='e-card';
      card.style.animationDelay=(i*0.025)+'s';
      const sTags = item.s.map(t=>`<span class="e-tag s-tag" onclick="filterStufe.has('${t}')?filterStufe.delete('${t}'):filterStufe.add('${t}');rebuildActive();renderExplore()">${t}</span>`).join('');
      const fTags = item.f.map(t=>`<span class="e-tag" onclick="filterFach.has('${t}')?filterFach.delete('${t}'):filterFach.add('${t}');rebuildActive();renderExplore()">${t}</span>`).join('');
      card.innerHTML=`
        <div class="e-body">
          <div class="e-text" style="color:${p.color}">${item.t}</div>
          <div class="e-tags">${sTags}${fTags}</div>
        </div>`;
      grid.appendChild(card);
    });

    block.appendChild(grid);
    content.appendChild(block);
  });

  if(total===0){
    content.innerHTML='<div class="no-results">// keine treffer — filter anpassen</div>';
  }

  const parts=[];
  if(filterStufe.size) parts.push([...filterStufe].join('+'));
  if(filterFach.size) parts.push([...filterFach].join('+'));
  if(filterPrinzip) parts.push(P.find(p=>p.id===filterPrinzip)?.name);
  countEl.textContent = `// ${total} idee${total!==1?'n':''}`+(parts.length?` für «${parts.join(' · ')}»`:'');
}


let allCollapsed = false;

function toggleCollapseAll(){
  allCollapsed = !allCollapsed;
  document.querySelectorAll('.prinzip-block').forEach(b=>b.classList.toggle('collapsed', allCollapsed));
  document.getElementById('btn-collapse').textContent = allCollapsed ? 'Alle aufklappen' : 'Alle zuklappen';
}

let filtersVisible = true;
function toggleFilters(){
  filtersVisible = !filtersVisible;
  const fg = document.getElementById('filter-groups');
  const btn = document.getElementById('filter-toggle');
  if(filtersVisible){
    fg.style.maxHeight = fg.scrollHeight + 'px';
    fg.style.opacity = '1';
    fg.style.pointerEvents = 'auto';
    fg.classList.remove('collapsed');
    btn.textContent = '⚙ Filter ausblenden';
  } else {
    fg.style.maxHeight = '0';
    fg.style.opacity = '0';
    fg.style.pointerEvents = 'none';
    fg.classList.add('collapsed');
    btn.textContent = '⚙ Filter anzeigen';
  }
}

// On mobile: collapse filters by default after first render
function initMobileFilters(){
  if(window.innerWidth <= 700){
    filtersVisible = false;
    const fg = document.getElementById('filter-groups');
    if(fg){ fg.classList.add('collapsed'); fg.style.maxHeight='0'; fg.style.opacity='0'; }
    const btn = document.getElementById('filter-toggle');
    if(btn) btn.textContent = '⚙ Filter anzeigen';
  }
}

// init
shuffle();
initMobileFilters();
</script>
