<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideenpool & Inspirationshäppchen</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f8f9fc;
  --surface:#ffffff;
  --surface2:#f2f4f8;
  --ink:#0a0c12;
  --ink2:#4a5068;
  --ink3:#9098b0;
  --line:rgba(10,12,30,0.08);
  --line2:rgba(10,12,30,0.15);
  --shadow:0 2px 8px rgba(10,12,30,0.07),0 0 1px rgba(10,12,30,0.06);
  --shadow-lift:0 12px 36px rgba(10,12,30,0.12),0 2px 6px rgba(10,12,30,0.06);
  --f-display:'Syne',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
  --f-body:'DM Sans',system-ui,sans-serif;
  --radius:10px;
}

body{
  font-family:var(--f-body);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}

/* subtle grid bg */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(10,12,30,0.024) 1px, transparent 1px),
    linear-gradient(90deg, rgba(10,12,30,0.024) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

/* ══ DISCOVER ══ */
#mode-discover{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px 60px;
  gap:0;
}

.d-eyebrow{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--ink3);
  margin-bottom:14px;
  text-align:center;
}

.d-title{
  font-family:var(--f-display);
  font-size:clamp(26px,5vw,52px);
  font-weight:800;
  text-align:center;
  line-height:1.05;
  margin-bottom:8px;
  color:var(--ink);
  letter-spacing:-0.02em;
}

.d-title span{
  display:inline-block;
  position:relative;
}

.d-title .accent{
  color:transparent;
  -webkit-text-stroke:2px var(--ink);
}

.d-sub{
  font-size:14px;
  color:var(--ink3);
  text-align:center;
  margin-bottom:52px;
  font-family:var(--f-mono);
  letter-spacing:0.02em;
}

/* ── SHELF ── */
#shelf{
  display:flex;
  gap:18px;
  justify-content:center;
  align-items:flex-start;
  margin-bottom:40px;
  width:100%;
  max-width:960px;
  flex-wrap:wrap;
}

.karte{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  width:280px;
  flex-shrink:0;
  overflow:hidden;
  cursor:pointer;
  border:1px solid var(--line);
  transition:transform 0.28s cubic-bezier(.22,1,.36,1), box-shadow 0.22s ease;
  position:relative;
}

.karte:nth-child(1){transform:rotate(-1.5deg) translateY(4px)}
.karte:nth-child(2){transform:rotate(0.8deg) translateY(-4px)}
.karte:nth-child(3){transform:rotate(-0.4deg) translateY(2px)}

.karte:hover{
  transform:rotate(0deg) translateY(-8px) scale(1.01) !important;
  box-shadow:var(--shadow-lift);
  z-index:20;
  border-color:var(--line2);
}

.karte-stripe{
  height:4px;
  width:100%;
}

.karte-body{
  padding:18px 20px 16px;
}

.karte-prinzip{
  font-family:var(--f-mono);
  font-size:9px;
  font-weight:500;
  letter-spacing:0.14em;
  text-transform:uppercase;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}

.karte-prinzip::before{
  content:'';
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  flex-shrink:0;
}

.karte-idee{
  font-family:var(--f-display);
  font-size:15px;
  font-weight:600;
  line-height:1.4;
  color:var(--ink);
  margin-bottom:16px;
  letter-spacing:-0.01em;
}

.karte-tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.ktag{
  font-family:var(--f-mono);
  font-size:9px;
  font-weight:500;
  padding:3px 8px;
  border-radius:4px;
  border:1px solid var(--line2);
  color:var(--ink2);
  background:var(--surface2);
  cursor:pointer;
  transition:all 0.13s;
  letter-spacing:0.04em;
}

.ktag.stufen-tag{
  border-style:dashed;
}

.ktag:hover{
  background:var(--ink);
  color:var(--surface);
  border-color:var(--ink);
}

/* ── ACTIONS ── */
.d-actions{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.d-count{
  font-family:var(--f-mono);
  font-size:10px;
  color:var(--ink3);
  letter-spacing:0.08em;
  min-height:14px;
}

.btn-shuffle{
  font-family:var(--f-display);
  font-size:13px;
  font-weight:700;
  padding:13px 36px;
  border-radius:40px;
  border:2px solid var(--ink);
  background:var(--ink);
  color:var(--surface);
  cursor:pointer;
  letter-spacing:0.01em;
  transition:all 0.16s;
  box-shadow:4px 4px 0 rgba(10,12,30,0.12);
}

.btn-shuffle:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 rgba(10,12,30,0.15);
}

.btn-shuffle:active{
  transform:translate(1px,1px);
  box-shadow:2px 2px 0 rgba(10,12,30,0.10);
}

.btn-to-explore{
  font-family:var(--f-mono);
  font-size:10px;
  color:var(--ink3);
  background:none;
  border:none;
  cursor:pointer;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:4px 8px;
  transition:color 0.14s;
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-color:var(--line2);
  opacity:0.5;
  transition:opacity 0.3s,color 0.15s;
}

.btn-to-explore.visible{opacity:1}
.btn-to-explore:hover{color:var(--ink)}

/* ══ EXPLORE ══ */
#mode-explore{
  display:none;
  position:relative;
  z-index:1;
  min-height:100vh;
}

#mode-explore.on{display:block}

.ex-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(248,249,252,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:20px 40px 16px;
}

.ex-header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  gap:12px;
}

.ex-title{
  font-family:var(--f-display);
  font-size:18px;
  font-weight:800;
  letter-spacing:-0.02em;
  color:var(--ink);
}

.btn-back{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink3);
  background:none;
  border:1px solid var(--line2);
  border-radius:4px;
  padding:6px 14px;
  cursor:pointer;
  transition:all 0.14s;
}

.btn-back:hover{color:var(--ink);border-color:var(--ink)}

/* ── FILTER GROUPS ── */
.filter-groups{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.filter-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.filter-row-label{
  font-family:var(--f-mono);
  font-size:9px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink3);
  min-width:44px;
  flex-shrink:0;
}

.fbtn{
  font-family:var(--f-mono);
  font-size:9px;
  font-weight:500;
  letter-spacing:0.05em;
  padding:4px 11px;
  border-radius:4px;
  border:1px solid var(--line2);
  background:var(--surface);
  color:var(--ink2);
  cursor:pointer;
  transition:all 0.12s;
}

.fbtn:hover{background:var(--surface2);color:var(--ink)}

.fbtn.on{
  background:var(--ink);
  color:var(--surface);
  border-color:var(--ink);
}

.fbtn.prinzip-btn.on{
  color:var(--surface);
  border-color:transparent;
}

/* ── RESULT COUNT ── */
.result-count{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:0.08em;
  color:var(--ink3);
  padding:16px 40px 0;
  max-width:1280px;
  margin:0 auto;
}

/* ── EXPLORE CONTENT ── */
.ex-content{
  padding:20px 40px 80px;
  max-width:1280px;
  margin:0 auto;
}

.prinzip-block{
  margin-bottom:40px;
}

.prinzip-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:var(--radius);
  margin-bottom:14px;
  cursor:pointer;
  transition:opacity 0.15s;
  border:1px solid transparent;
  user-select:none;
}

.prinzip-head:hover{opacity:0.85}
.prinzip-head.active-filter{border-color:currentColor;opacity:1}

.p-dot{
  width:8px;
  height:8px;
  border-radius:2px;
  flex-shrink:0;
}

.p-nr{
  font-family:var(--f-mono);
  font-size:10px;
  color:inherit;
  opacity:0.7;
  letter-spacing:0.06em;
}

.p-name{
  font-family:var(--f-display);
  font-size:16px;
  font-weight:700;
  letter-spacing:-0.01em;
}

.p-sub{
  font-family:var(--f-body);
  font-size:12px;
  opacity:0.65;
}

.p-count{
  font-family:var(--f-mono);
  font-size:10px;
  opacity:0.5;
  margin-left:auto;
}

/* ── CARDS GRID ── */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}

.e-card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  border:1px solid var(--line);
  transition:box-shadow 0.18s,transform 0.18s,border-color 0.15s;
}

.e-card:hover{
  box-shadow:var(--shadow-lift);
  transform:translateY(-2px);
  border-color:var(--line2);
}

.e-card.hidden{display:none}

.e-stripe{height:3px}

.e-body{
  padding:12px 14px 10px;
}

.e-text{
  font-family:var(--f-display);
  font-size:13px;
  font-weight:600;
  line-height:1.45;
  color:var(--ink);
  margin-bottom:10px;
  letter-spacing:-0.005em;
}

.e-tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.e-tag{
  font-family:var(--f-mono);
  font-size:9px;
  font-weight:500;
  padding:2px 7px;
  border-radius:3px;
  border:1px solid var(--line2);
  color:var(--ink2);
  background:var(--surface2);
  cursor:pointer;
  transition:all 0.11s;
  letter-spacing:0.04em;
}

.e-tag.s-tag{border-style:dashed}
.e-tag:hover{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.no-results{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--ink3);
  font-family:var(--f-mono);
  font-size:12px;
  letter-spacing:0.06em;
}

/* ── ANIMATIONS ── */
@keyframes cardIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.karte{animation:cardIn 0.4s cubic-bezier(.22,1,.36,1) both}
.karte:nth-child(1){animation-delay:0.04s;transform:rotate(-1.5deg) translateY(4px)}
.karte:nth-child(2){animation-delay:0.11s;transform:rotate(0.8deg) translateY(-4px)}
.karte:nth-child(3){animation-delay:0.18s;transform:rotate(-0.4deg) translateY(2px)}

@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.e-card{animation:fadeUp 0.22s ease both}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  #shelf{gap:14px;flex-direction:column;align-items:center}
  .karte{width:calc(100vw - 40px);max-width:360px}
  .karte:nth-child(n){transform:none !important}
  .ex-header{padding:16px 20px 14px}
  .ex-content,.result-count{padding-left:20px;padding-right:20px}
  .cards-grid{grid-template-columns:1fr}
  .filter-row{gap:5px}
}
</style>
</head>
<body>

<div id="mode-discover">
  <p class="d-eyebrow">Lernen in einer Kultur der Digitalität</p>
  <h1 class="d-title">
    <span>Ideenpool</span> <span class="accent">&amp;</span><br>
    <span>Inspirationshäppchen</span>
  </h1>
  <p class="d-sub">// drei zufällige ideen — lass dich überraschen</p>
  <div id="shelf"></div>
  <div class="d-actions">
    <div class="d-count" id="d-count"></div>
    <button class="btn-shuffle" onclick="shuffle()">↺ &nbsp;Andere zeigen</button>
    <button class="btn-to-explore" id="btn-explore" onclick="goExplore(null)">Alle Ideen systematisch durchsuchen →</button>
  </div>
</div>

<div id="mode-explore">
  <div class="ex-header">
    <div class="ex-header-row">
      <span class="ex-title">Alle Inspirationshäppchen</span>
      <button class="btn-back" onclick="goDiscover()">← Entdecken</button>
    </div>
    <div class="filter-groups">
      <div class="filter-row">
        <span class="filter-row-label">Stufe</span>
        <div id="filter-stufe" style="display:flex;gap:5px;flex-wrap:wrap"></div>
      </div>
      <div class="filter-row">
        <span class="filter-row-label">Fach</span>
        <div id="filter-fach" style="display:flex;gap:5px;flex-wrap:wrap"></div>
      </div>
      <div class="filter-row">
        <span class="filter-row-label">Prinzip</span>
        <div id="filter-prinzip" style="display:flex;gap:5px;flex-wrap:wrap"></div>
      </div>
    </div>
  </div>
  <div class="result-count" id="result-count"></div>
  <div class="ex-content" id="ex-content"></div>
</div>

let shuffleN = 0;
let usedSet = new Set();
let filterStufe = new Set();
let filterFach = new Set();
let filterPrinzip = null;

// ── DISCOVER ──
function allIdeen(){
  return P.flatMap(p=>p.ideen.map(i=>({...i,pid:p.id,pname:p.name,color:p.color,bg:p.bg})));
}

function shuffle(){
  shuffleN++;
  document.getElementById('d-count').textContent = shuffleN > 1 ? shuffleN+'. Runde' : '';
  const exploreBtn = document.getElementById('btn-explore');
  if(shuffleN >= 3) exploreBtn.classList.add('visible');

  let pool = allIdeen();
  if(usedSet.size > pool.length * 0.6) usedSet.clear();
  pool = pool.filter(i=>!usedSet.has(i.t));
  pool.sort(()=>Math.random()-0.5);
  const picks = pool.slice(0,3);
  picks.forEach(i=>usedSet.add(i.t));

  const shelf = document.getElementById('shelf');
  shelf.style.opacity='0';
  shelf.style.transform='translateY(8px)';
  shelf.style.transition='opacity 0.16s,transform 0.16s';
  setTimeout(()=>{
    renderShelf(picks);
    shelf.style.opacity='1';
    shelf.style.transform='translateY(0)';
  },160);
}

function renderShelf(picks){
  const shelf = document.getElementById('shelf');
  shelf.innerHTML='';
  picks.forEach(item=>{
    const card = document.createElement('div');
    card.className='karte';
    const sTags = item.s.map(t=>`<span class="ktag stufen-tag" onclick="filterAndExplore('s','${t}')">${t}</span>`).join('');
    const fTags = item.f.map(t=>`<span class="ktag" onclick="filterAndExplore('f','${t}')">${t}</span>`).join('');
    card.innerHTML=`
      <div class="karte-stripe" style="background:${item.color}"></div>
      <div class="karte-body">
        <div class="karte-prinzip" style="color:${item.color}">
          <span style="background:${item.color}" class="karte-prinzip" ></span>
          ${item.pname}
        </div>
        <div class="karte-idee">${item.t}</div>
        <div class="karte-tags">${sTags}${fTags}</div>
      </div>`;
    card.onclick=()=>filterAndExplore('p',item.pid);
    // prevent tag clicks from triggering card click
    card.querySelectorAll('.ktag').forEach(el=>el.addEventListener('click',e=>e.stopPropagation()));
    shelf.appendChild(card);
  });
}

function filterAndExplore(type, val){
  filterStufe.clear(); filterFach.clear(); filterPrinzip=null;
  if(type==='s') filterStufe.add(val);
  else if(type==='f') filterFach.add(val);
  else if(type==='p') filterPrinzip=val;
  goExplore();
}

// ── EXPLORE ──
function goExplore(){
  document.getElementById('mode-discover').style.display='none';
  const ex = document.getElementById('mode-explore');
  ex.classList.add('on');
  buildFilterBtns();
  renderExplore();
  window.scrollTo(0,0);
}

function goDiscover(){
  document.getElementById('mode-explore').classList.remove('on');
  document.getElementById('mode-discover').style.display='flex';
  window.scrollTo(0,0);
}

function buildFilterBtns(){
  // Stufe
  const fs = document.getElementById('filter-stufe');
  fs.innerHTML='';
  const b0 = mkFBtn('Alle', filterStufe.size===0, ()=>{filterStufe.clear();renderExplore();rebuildActive()});
  fs.appendChild(b0);
  STUFEN.forEach(t=>{
    const b = mkFBtn(t, filterStufe.has(t), ()=>{
      filterStufe.has(t)?filterStufe.delete(t):filterStufe.add(t);
      renderExplore(); rebuildActive();
    });
    fs.appendChild(b);
  });

  // Fach
  const ff = document.getElementById('filter-fach');
  ff.innerHTML='';
  const b1 = mkFBtn('Alle', filterFach.size===0, ()=>{filterFach.clear();renderExplore();rebuildActive()});
  ff.appendChild(b1);
  FAECHER.forEach(t=>{
    const b = mkFBtn(t, filterFach.has(t), ()=>{
      filterFach.has(t)?filterFach.delete(t):filterFach.add(t);
      renderExplore(); rebuildActive();
    });
    ff.appendChild(b);
  });

  // Prinzip
  const fp = document.getElementById('filter-prinzip');
  fp.innerHTML='';
  const b2 = mkFBtn('Alle', filterPrinzip===null, ()=>{filterPrinzip=null;renderExplore();rebuildActive()});
  fp.appendChild(b2);
  P.forEach(p=>{
    const b = mkFBtn(p.name, filterPrinzip===p.id, ()=>{
      filterPrinzip = filterPrinzip===p.id ? null : p.id;
      renderExplore(); rebuildActive();
    }, p.color);
    fp.appendChild(b);
  });
}

function mkFBtn(label, active, onClick, color){
  const b = document.createElement('button');
  b.className='fbtn'+(active?' on':'');
  if(color && active) b.style.background=color;
  if(color && active) b.style.borderColor=color;
  b.textContent=label;
  b.addEventListener('click', onClick);
  return b;
}

function rebuildActive(){
  buildFilterBtns();
}

function cardMatches(item, p){
  const okStufe = filterStufe.size===0 || item.s.some(s=>filterStufe.has(s));
  const okFach = filterFach.size===0 || item.f.some(f=>filterFach.has(f));
  const okPrinzip = filterPrinzip===null || p.id===filterPrinzip;
  return okStufe && okFach && okPrinzip;
}

function renderExplore(){
  const content = document.getElementById('ex-content');
  const countEl = document.getElementById('result-count');
  content.innerHTML='';
  let total=0;

  P.forEach((p,pi)=>{
    const filtered = p.ideen.filter(i=>cardMatches(i,p));
    if(filtered.length===0) return;
    total+=filtered.length;

    const block = document.createElement('div');
    block.className='prinzip-block';

    const head = document.createElement('div');
    head.className='prinzip-head'+(filterPrinzip===p.id?' active-filter':'');
    head.style.background=p.bg;
    head.style.color=p.color;
    head.innerHTML=`
      <div class="p-dot" style="background:${p.color}"></div>
      <span class="p-nr">0${p.id}</span>
      <span class="p-name">${p.name}</span>
      <span class="p-sub">— ${p.sub}</span>
      <span class="p-count">${filtered.length} Ideen</span>`;
    head.onclick=()=>{
      filterPrinzip = filterPrinzip===p.id ? null : p.id;
      rebuildActive();
      renderExplore();
    };
    block.appendChild(head);

    const grid = document.createElement('div');
    grid.className='cards-grid';

    filtered.forEach((item,i)=>{
      const card = document.createElement('div');
      card.className='e-card';
      card.style.animationDelay=(i*0.025)+'s';
      const sTags = item.s.map(t=>`<span class="e-tag s-tag" onclick="filterStufe.has('${t}')?filterStufe.delete('${t}'):filterStufe.add('${t}');rebuildActive();renderExplore()">${t}</span>`).join('');
      const fTags = item.f.map(t=>`<span class="e-tag" onclick="filterFach.has('${t}')?filterFach.delete('${t}'):filterFach.add('${t}');rebuildActive();renderExplore()">${t}</span>`).join('');
      card.innerHTML=`
        <div class="e-stripe" style="background:${p.color}"></div>
        <div class="e-body">
          <div class="e-text">${item.t}</div>
          <div class="e-tags">${sTags}${fTags}</div>
        </div>`;
      grid.appendChild(card);
    });

    block.appendChild(grid);
    content.appendChild(block);
  });

  if(total===0){
    content.innerHTML='<div class="no-results">// keine treffer — filter anpassen</div>';
  }

  const parts=[];
  if(filterStufe.size) parts.push([...filterStufe].join('+'));
  if(filterFach.size) parts.push([...filterFach].join('+'));
  if(filterPrinzip) parts.push(P.find(p=>p.id===filterPrinzip)?.name);
  countEl.textContent = `// ${total} idee${total!==1?'n':''}`+(parts.length?` für «${parts.join(' · ')}»`:'');
}

// init
shuffle();
</script>
